services:
  demo:
    build: .
    ports: ["127.0.0.1:${DEMO_PORT:-8080}:8080"]
    environment:
      DEMO_MODE: "true"
      APP_ORIGIN: http://localhost:${DEMO_PORT:-8080}
      DATA_DIR: /data
    volumes:
      - demo-data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
volumes:
  demo-data:
