name: Dependabot Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Dependabot configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock

      - name: Verify dependency pins and hash locks
        run: python tools/check_requirements.py

      - name: Install hash-verified development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Lint Dependabot configuration
        run: python tools/check_dependabot.py

      - name: Test configuration checks
        run: python -m pytest tests/test_dependabot.py -q
