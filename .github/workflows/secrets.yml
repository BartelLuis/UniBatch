name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan Git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for verified tool installation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install checksum-verified Gitleaks
        run: python tools/install_ci_tools.py gitleaks

      - name: Scan all checked-out Git refs
        run: >-
          artifacts/ci-tools/gitleaks git . --log-opts="--all --full-history --diff-merges=separate"
          --config=.gitleaks.toml --redact=100 --ignore-gitleaks-allow --report-format=json
          --report-path=artifacts/gitleaks.json

      - name: Upload redacted secret scan report
        if: ${{ always() && hashFiles('artifacts/gitleaks.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-report
          path: artifacts/gitleaks.json
          if-no-files-found: error
          retention-days: 7
