name: Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-checks:
    name: Bandit and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock

      - name: Install hash-locked security tools and application dependencies
        id: dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Verify manifests and locks agree
        id: manifests
        run: python tools/check_requirements.py

      - name: Prepare report directory
        run: mkdir -p artifacts/security

      - name: Scan application and maintenance tools with Bandit
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.manifests.outcome == 'success' }}
        run: python -m bandit -r app tools --format json --output artifacts/security/bandit.json

      - name: Audit every locked production dependency
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.manifests.outcome == 'success' }}
        run: >-
          python -m pip_audit --require-hashes --disable-pip --strict
          --requirement requirements.lock --format json
          --output artifacts/security/dependency-audit.json
          --progress-spinner off --timeout 30

      - name: Upload security reports
        if: ${{ always() && hashFiles('artifacts/security/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            artifacts/security/bandit.json
            artifacts/security/dependency-audit.json
          if-no-files-found: error
          retention-days: 7

  npm-audit:
    name: JavaScript development dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked development tools without package scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Audit JavaScript development dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --audit-level=moderate --json > artifacts/security/npm-audit.json

      - name: Upload JavaScript dependency audit report
        if: ${{ always() && hashFiles('artifacts/security/npm-audit.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: javascript-dependency-audit
          path: artifacts/security/npm-audit.json
          if-no-files-found: error
          retention-days: 7

  codeql:
    # Public repositories run by default. Private repositories require an
    # explicit opt-in after Code Security availability has been confirmed.
    # An explicit false disables CodeQL; missing visibility stays opted out.
    if: >-
      ${{ vars.ENABLE_CODEQL != 'false' &&
          (vars.ENABLE_CODEQL == 'true' || toJSON(github.event.repository.private) == 'false') }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/security/codeql-config.yml

      - name: Analyze application and tools
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload-database: false
