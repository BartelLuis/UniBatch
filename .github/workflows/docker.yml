name: Docker and Browser

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build image and exercise the demo GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEMO_PORT: "18080"
      UNIFI_BROWSER_URL: http://localhost:18080
      COMPOSE_PROJECT_NAME: unifi-ci
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock

      - name: Verify dependency pins
        run: python tools/check_requirements.py

      - name: Install hash-locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: unifi-batch:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the isolated simulator
        run: docker compose -f compose.demo.yaml -f .github/compose.ci.yaml up --no-build --detach --wait --wait-timeout 120

      - name: Exercise WLAN, VLAN, permissions and approvals in the browser
        run: python tests/browser_smoke.py

      - name: Exercise RADIUS CRUD and recovery in the browser
        run: python tests/browser_radius_smoke.py

      - name: Collect container logs
        if: ${{ always() }}
        run: |
          mkdir -p artifacts
          docker compose -f compose.demo.yaml -f .github/compose.ci.yaml logs --no-color > artifacts/docker.log

      - name: Upload browser screenshots and container logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-browser-report
          path: |
            artifacts/*.png
            artifacts/docker.log
          if-no-files-found: warn
          retention-days: 7

      - name: Export the tested image for offline import
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: |
          docker save --output artifacts/unifi-batch-image.tar unifi-batch:ci
          gzip -n artifacts/unifi-batch-image.tar
          cd artifacts
          sha256sum unifi-batch-image.tar.gz > unifi-batch-image.tar.gz.sha256

      - name: Upload the tested image
        if: ${{ success() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ github.sha }}
          path: |
            artifacts/unifi-batch-image.tar.gz
            artifacts/unifi-batch-image.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove the disposable simulator
        if: ${{ always() }}
        run: docker compose -f compose.demo.yaml -f .github/compose.ci.yaml down --volumes --remove-orphans
